name: Vatan Flutter APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get original Vatan app icon
        shell: bash
        run: |
          mkdir -p assets
          for path in assets/icon.png assets/favicon.png assets/images/icon.png assets/images/favicon.png icon.png favicon.png; do
            if curl -fLsS "https://raw.githubusercontent.com/hirad990/VATANMSG/main/$path" -o assets/icon.png; then
              echo "Using original icon from VATANMSG/$path"
              break
            fi
          done
          if [ ! -s assets/icon.png ]; then
            python3 - <<'PY'
          import struct,zlib
          w=h=512; raw=bytearray()
          for y in range(h):
            raw.append(0)
            for x in range(w):
              d=min(abs(y-(x*.78+90)),abs(y-(-x*.78+480)))
              raw.extend((74,151,255,255) if d<24 and 80<x<430 else (7,27,52,255))
          def chunk(t,d): return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">2I5B",w,h,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(bytes(raw),9))+chunk(b"IEND",b"")
          open("assets/icon.png","wb").write(png)
          PY
            echo "Fallback icon generated; no icon was found in original repo candidates."
          fi
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart format --set-exit-if-changed lib
      - run: flutter analyze --no-pub
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vatan-flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
